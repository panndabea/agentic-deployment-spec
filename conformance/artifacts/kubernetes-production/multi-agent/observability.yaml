apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-ops-agent-suite-observability-traces
  namespace: customer-ops-agent-suite
  labels:
    app.kubernetes.io/name: customer-ops-agent-suite
    app.kubernetes.io/managed-by: ads-reference-processor
    ads.dev/target-profile: kubernetes-production
    ads.dev/requirement-type: observability
  annotations:
    ads.dev/source-path: "$.observability.traces"
data:
  signal: traces
  requirement: '{"required":true,"format":"opentelemetry"}'
  targetSinks: '{"sinks":["opentelemetry-collector"]}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-ops-agent-suite-observability-metrics
  namespace: customer-ops-agent-suite
  labels:
    app.kubernetes.io/name: customer-ops-agent-suite
    app.kubernetes.io/managed-by: ads-reference-processor
    ads.dev/target-profile: kubernetes-production
    ads.dev/requirement-type: observability
  annotations:
    ads.dev/source-path: "$.observability.metrics"
data:
  signal: metrics
  requirement: '{"required":["request_latency","orchestration_duration","agent_handoff_count","queue_depth","tool_call_count","approval_wait_time","model_cost"]}'
  targetSinks: '{"sinks":["prometheus"]}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-ops-agent-suite-observability-logs
  namespace: customer-ops-agent-suite
  labels:
    app.kubernetes.io/name: customer-ops-agent-suite
    app.kubernetes.io/managed-by: ads-reference-processor
    ads.dev/target-profile: kubernetes-production
    ads.dev/requirement-type: observability
  annotations:
    ads.dev/source-path: "$.observability.logs"
data:
  signal: logs
  requirement: '{"streams":["api","orchestrator","planner-agent","support-agent","tool-server"],"redaction":{"required":true}}'
  targetSinks: "{}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-ops-agent-suite-observability-auditevents
  namespace: customer-ops-agent-suite
  labels:
    app.kubernetes.io/name: customer-ops-agent-suite
    app.kubernetes.io/managed-by: ads-reference-processor
    ads.dev/target-profile: kubernetes-production
    ads.dev/requirement-type: observability
  annotations:
    ads.dev/source-path: "$.observability.auditEvents"
data:
  signal: auditEvents
  requirement: '{"required":["deployment_planned","deployment_applied","tool_call_denied","approval_requested","approval_granted","approval_denied","policy_decision_recorded","secret_resolved"]}'
  targetSinks: '{"sinks":["security-audit-log"]}'
