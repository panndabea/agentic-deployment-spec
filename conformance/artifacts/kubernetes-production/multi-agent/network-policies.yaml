apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: customer-ops-agent-suite-default-deny-egress
  namespace: customer-ops-agent-suite
  labels:
    app.kubernetes.io/name: customer-ops-agent-suite
    app.kubernetes.io/managed-by: ads-reference-processor
    ads.dev/target-profile: kubernetes-production
  annotations:
    ads.dev/source-path: "$.security.outbound"
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-ops-agent-suite-egress-policy
  namespace: customer-ops-agent-suite
  labels:
    app.kubernetes.io/name: customer-ops-agent-suite
    app.kubernetes.io/managed-by: ads-reference-processor
    ads.dev/target-profile: kubernetes-production
    ads.dev/requirement-type: networking
  annotations:
    ads.dev/source-path: "$.security.outbound.allow"
data:
  defaultDeny: 'true'
  allowedDestinations: api.openai.com,billing.internal.example,crm.internal.example
