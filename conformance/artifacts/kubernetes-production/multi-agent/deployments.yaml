apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: customer-ops-agent-suite
  labels:
    app.kubernetes.io/name: customer-ops-agent-suite
    app.kubernetes.io/managed-by: ads-reference-processor
    ads.dev/target-profile: kubernetes-production
    app.kubernetes.io/component: api
  annotations:
    ads.dev/component: api
    ads.dev/source-path: "$.runtime.components[0]"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-ops-agent-suite
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-ops-agent-suite
        app.kubernetes.io/component: api
      annotations:
        ads.dev/source-path: "$.runtime.components[0]"
    spec:
      containers:
      - name: api
        image: ghcr.io/example/customer-ops-api:1.0.0
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: "/ready"
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: "/healthz"
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
      serviceAccountName: customer-ops-agents
