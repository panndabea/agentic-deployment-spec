apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner-agent
  namespace: customer-ops-agent-suite
  labels:
    app.kubernetes.io/name: customer-ops-agent-suite
    app.kubernetes.io/managed-by: ads-reference-processor
    ads.dev/target-profile: kubernetes-production
    app.kubernetes.io/component: planner-agent
  annotations:
    ads.dev/component: planner-agent
    ads.dev/source-path: "$.runtime.components[2]"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: customer-ops-agent-suite
      app.kubernetes.io/component: planner-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: customer-ops-agent-suite
        app.kubernetes.io/component: planner-agent
      annotations:
        ads.dev/source-path: "$.runtime.components[2]"
    spec:
      containers:
      - name: planner-agent
        image: ghcr.io/example/customer-ops-planner:1.0.0
        env:
        - name: MODEL_API_KEY
          valueFrom:
            secretKeyRef:
              name: planner-agent-model-api-key
              key: value
              optional: false
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: planner-agent-database-url
              key: value
              optional: false
      serviceAccountName: customer-ops-agents
---
