---
services:
  api:
    image: ghcr.io/example/support-agent:1.0.0
    labels:
      ads.dev/name: support-agent
      ads.dev/component: api
      ads.dev/source-path: "$.runtime.components[0]"
    environment:
      MODEL_API_KEY: "${MODEL_API_KEY:?ADS secret model-api-key is required}"
      DATABASE_URL: "${DATABASE_URL:?ADS secret database-url is required}"
    volumes:
    - support-agent-api-state:/var/lib/ads/api
  tool-server:
    image: ghcr.io/example/support-tools:1.0.0
    labels:
      ads.dev/name: support-agent
      ads.dev/component: tool-server
      ads.dev/source-path: "$.runtime.components[1]"
    environment:
      MODEL_API_KEY: "${MODEL_API_KEY:?ADS secret model-api-key is required}"
      DATABASE_URL: "${DATABASE_URL:?ADS secret database-url is required}"
volumes:
  support-agent-api-state:
    labels:
      ads.dev/name: support-agent
      ads.dev/component: api
      ads.dev/source-path: "$.runtime.components[0]"
x-ads-requirements:
  security:
    sandbox: restricted
    toolPolicy:
      default: deny
      allow:
      - read-ticket
      - draft-reply
    outbound:
      default: deny
      allow:
      - api.openai.com
      - internal.crm.example
  networking:
    ingress: {}
    internalTraffic: {}
    egress: {}
    outbound:
      default: deny
      allow:
      - api.openai.com
      - internal.crm.example
    defaultDeny: true
    target:
      defaultDenyEgress: true
      allowedDestinations:
      - api.openai.com
      - internal.crm.example
  approvals:
    required:
    - action: send-customer-email
      mode: human
      reason: external side effect
    - action: mutate-crm-record
      mode: policy-and-human
      reason: privileged business data
      policyDecisionPointRef: crm-mutation-policy
    policyDecisionPoints:
    - name: crm-mutation-policy
      engineRef: opa/customer-operations
      appliesTo:
      - mutate-crm-record
      decisionInputs:
      - actor
      - action
      - dataClass
      - environment
      failureMode: closed
      auditEvents:
      - policy_decision_recorded
    targetHandlers:
      human:
        ref: local-approval-runbook
      policy:
        ref: local-policy-check
    targetPolicyDecisionPoints:
      crm-mutation-policy:
        ref: local/customer-operations-policy
      risk-classification-policy:
        ref: local/customer-risk-policy
      financial-action-policy:
        ref: local/billing-actions-policy
      data-export-policy:
        ref: local/data-export-policy
  observability:
    traces:
      required: true
      format: opentelemetry
    metrics:
      required:
      - request_latency
      - tool_call_count
      - approval_wait_time
      - model_cost
    logs: {}
    auditEvents:
      required:
      - deployment_planned
      - policy_decision_recorded
      - approval_requested
      - tool_call_denied
      - approval_granted
      - approval_denied
      - secret_resolved
    targetSinks:
      traces:
        sinks:
        - local-otel-collector
      metrics:
        sinks:
        - local-prometheus
      auditEvents:
        sinks:
        - local-audit-log
  supplyChain:
    requirements: {}
    targetControls:
      signatures:
        available: false
      sbom:
        available: false
      provenance:
        available: false
  reliability: {}
  externalComponents: []
