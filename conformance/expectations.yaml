    - examples/multi-agent.yaml
    - examples/serverless-auxiliary.yaml
    - examples/stateful-agent.yaml
    - examples/supply-chain.yaml
    - examples/conformance/invalid/duplicate-component.yaml
    - examples/conformance/invalid/dependency-cycle.yaml
    - examples/conformance/invalid/missing-dependency.yaml
    - examples/conformance/invalid/missing-policy-decision-point.yaml
    - examples/conformance/invalid/name-normalization-collision.yaml
    - examples/conformance/invalid/profile-mismatch.yaml
    - examples/conformance/invalid/scoped-capability-missing-component.yaml
    - examples/conformance/invalid/scoped-secret-missing-component.yaml
    - examples/conformance/invalid/required-extension-unsupported.yaml
    - examples/conformance/invalid/supply-chain-image-missing-digest.yaml
    - examples/conformance/warnings/missing-audit-coverage.yaml
    - examples/conformance/warnings/missing-policy-decision-point-ref.yaml
    - examples/conformance/warnings/missing-threat-model.yaml
