planningCore:
  profileRejects:
    - example: examples/conformance/invalid/profile-mismatch.yaml
      context: contexts/kubernetes-production.yaml
      expectedDiagnostics:
        - processor-limitation
        - $.profiles
        - kubernetes-production
  redaction:
    - example: examples/minimal.yaml
      context: contexts/invalid/secret-payload.yaml
      forbidden:
        - super-secret-token
        - super-secret-password
        - postgres://super-secret-database
        - super-secret-private-key

plans:
  accepts:
    - example: examples/minimal.yaml
      context: contexts/compose-single-host.yaml
      fixture: conformance/plans/minimal.compose-single-host.json
    - example: examples/minimal.yaml
      context: contexts/kubernetes-production.yaml
      fixture: conformance/plans/minimal.kubernetes-production.json
    - example: examples/approval-policy.yaml
      context: contexts/kubernetes-production.yaml
      fixture: conformance/plans/approval-policy.kubernetes-production.json
    - example: examples/multi-agent.yaml
      context: contexts/kubernetes-production.yaml
      fixture: conformance/plans/multi-agent.kubernetes-production.json
  rejects:
    - example: examples/minimal.yaml
      context: contexts/air-gapped.yaml
      expectedDiagnostics:
        - network-unresolved
        - api.openai.com

artifacts:
  accepts:
    - target: compose
      example: examples/minimal.yaml
      context: contexts/compose-single-host.yaml
      fixtureDir: conformance/artifacts/compose-single-host/minimal
    - target: kubernetes
      example: examples/minimal.yaml
      context: contexts/kubernetes-production.yaml
      fixtureDir: conformance/artifacts/kubernetes-production/minimal
    - target: kubernetes
      example: examples/multi-agent.yaml
      context: contexts/kubernetes-production.yaml
      fixtureDir: conformance/artifacts/kubernetes-production/multi-agent
  rejects:
    - target: compose
      example: examples/multi-agent.yaml
      context: contexts/compose-single-host.yaml
      expectedDiagnostics:
        - capability-unsupported
        - secret-unbound
        - network-unresolved
    - target: kubernetes
      example: examples/serverless-auxiliary.yaml
      context: contexts/serverless-auxiliary.yaml
      expectedDiagnostics:
        - processor-limitation
        - serverless-auxiliary
        - kubernetes-production
