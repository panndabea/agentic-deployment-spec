apiVersion: ads.dev/v1
kind: AgenticDeployment
metadata:
  name: session-agent
  owner: platform-team
  description: Stateful support agent with durable sessions and managed rollback.
  labels:
    tier: production
    workload: stateful-agent

profiles:
  - kubernetes-production
  - managed-container-runtime

runtime:
  components:
    - name: api
      type: agent-runtime
      image: ghcr.io/example/session-agent:1.0.0
      execution:
        mode: request-response
        concurrency: 12
      ports:
        - name: http
          containerPort: 8080
          exposure: external
      dependsOn:
        - session-store
      state:
        mode: durable-session
        store: session-store
      health:
        readiness:
          path: /ready
          port: http
        liveness:
          path: /healthz
          port: http
      scaling:
        minReplicas: 2
        maxReplicas: 6
    - name: session-store
      type: state-store
      externalRef: platform://postgres/session-agent
      execution:
        mode: external

capabilities:
  required:
    - container-runtime
    - secret-injection
    - persistent-storage
    - outbound-egress-policy
    - trace-export
    - metrics-export
    - audit-log-export
    - human-approval
    - policy-decision
    - horizontal-scaling
    - rollback

secrets:
  required:
    - name: model-api-key
      purpose: model-provider-auth
      rotation: required
      source: platform-secret
      injection: env
      reload: restart-required
      for:
        - api
    - name: database-url
      purpose: durable-session-store
      rotation: required
      source: platform-secret
      injection: env
      reload: restart-required
      for:
        - api
        - session-store

security:
  defaultSandbox: restricted
  outbound:
    default: deny
    allow:
      - api.openai.com
      - internal.crm.example
  toolPolicy:
    default: deny
    allow:
      - read-ticket
      - draft-reply
      - restore-session
    deny:
      - send-customer-email
  trustBoundaries:
    - name: user-to-agent
      from: user
      to: api
    - name: agent-to-session-store
      from: api
      to: session-store
  threatModel:
    assets:
      - customer-support-data
      - session-state
      - model-api-key
    actors:
      - end-user
      - agent-runtime
      - policy-engine
      - platform-operator
    threats:
      - id: unsafe-session-restore
        category: memory-isolation-failure
        assets:
          - session-state
        mitigations:
          - restore-policy-gate
          - state-restore-audit
      - id: prompt-injection
        category: prompt-injection
        assets:
          - customer-support-data
        mitigations:
          - deny-by-default-tools
          - restricted-egress
    mitigations:
      - id: restore-policy-gate
        fields:
          - approvals.required
      - id: state-restore-audit
        fields:
          - observability.auditEvents
      - id: deny-by-default-tools
        fields:
          - security.toolPolicy
      - id: restricted-egress
        fields:
          - security.outbound
    review:
      status: reviewed
      reviewedBy: platform-security
      cadence: release

approvals:
  policyDecisionPoints:
    - name: session-restore-policy
      engineRef: opa/session-state
      appliesTo:
        - restore-session
      decisionInputs:
        - actor
        - action
        - sessionOwner
        - restoreAge
      failureMode: closed
      auditEvents:
        - policy_decision_recorded
        - state_restore_started
  required:
    - action: send-customer-email
      mode: human
      reason: external side effect
      scope:
        component: api
        dataClass: customer-communication
      auditEvents:
        - approval_requested
        - approval_granted
        - approval_denied
    - action: restore-session
      mode: policy
      reason: replaying durable agent state can expose historical customer context
      policyDecisionPointRef: session-restore-policy
      scope:
        component: api
        dataClass: session-state
      auditEvents:
        - policy_decision_recorded
        - state_restore_started

observability:
  traces:
    required: true
    format: opentelemetry
  metrics:
    required:
      - request_latency
      - session_load_latency
      - session_checkpoint_latency
      - session_restore_count
      - tool_call_count
      - model_cost
  auditEvents:
    required:
      - deployment_planned
      - deployment_rolled_back
      - secret_resolved
      - state_checkpoint_written
      - state_restore_started
      - approval_requested
      - approval_granted
      - approval_denied
      - policy_decision_recorded
      - tool_call_denied
  logs:
    streams:
      - api
    redaction:
      required: true

networking:
  ingress:
    - name: public-api
      component: api
      port: http
      tls: required
      auth: required
  internal:
    - from: api
      to:
        - session-store
  egress:
    default: deny
    allow:
      - api.openai.com
      - internal.crm.example

reliability:
  rollout:
    strategy: rolling
    maxUnavailable: 1
  rollback:
    automatic: true
    triggers:
      - failed_readiness
      - session_restore_errors
  retries:
    default:
      attempts: 3
      backoff: exponential
      jitter: true
  timeouts:
    request: 30s
    sessionRestore: 10s
