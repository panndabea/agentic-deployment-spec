apiVersion: ads.dev/v0alpha1
kind: AgenticDeployment
metadata:
  name: support-agent
  owner: platform-team
  labels:
    tier: production

profiles:
  - kubernetes-production
  - compose-single-host
  - managed-container-runtime

runtime:
  components:
    - name: api
      type: agent-runtime
      image: ghcr.io/example/support-agent:1.0.0
      execution:
        mode: request-response
        concurrency: 8
      ports:
        - name: http
          containerPort: 8080
      state:
        mode: durable-session
        store: postgres
    - name: tool-server
      type: tool-server
      image: ghcr.io/example/support-tools:1.0.0
      execution:
        mode: internal-service

capabilities:
  required:
    - secret-injection
    - persistent-storage
    - outbound-egress-policy
    - trace-export
    - metrics-export
    - audit-log-export
    - human-approval
    - policy-decision

secrets:
  required:
    - name: model-api-key
      purpose: model-provider-auth
      rotation: required
    - name: database-url
      purpose: session-state
      rotation: required

security:
  defaultSandbox: restricted
  outbound:
    default: deny
    allow:
      - api.openai.com
      - internal.crm.example
  toolPolicy:
    default: deny
    allow:
      - read-ticket
      - draft-reply
  trustBoundaries:
    - name: user-to-agent
      from: user
      to: api
    - name: agent-to-tools
      from: api
      to: tool-server
  threatModel:
    assets:
      - customer-support-data
      - model-api-key
      - session-state
    actors:
      - end-user
      - agent-runtime
      - platform-operator
    threats:
      - id: prompt-injection
        category: prompt-injection
        assets:
          - customer-support-data
        mitigations:
          - deny-by-default-tools
          - human-approval
      - id: secret-exfiltration
        category: secret-exfiltration
        assets:
          - model-api-key
        mitigations:
          - secret-injection
          - restricted-egress
    mitigations:
      - id: deny-by-default-tools
        fields:
          - security.toolPolicy
      - id: human-approval
        fields:
          - approvals.required
      - id: secret-injection
        fields:
          - secrets.required
      - id: restricted-egress
        fields:
          - security.outbound
    review:
      status: reviewed
      reviewedBy: platform-security
      cadence: release

approvals:
  policyDecisionPoints:
    - name: crm-mutation-policy
      engineRef: opa/customer-operations
      appliesTo:
        - mutate-crm-record
      decisionInputs:
        - actor
        - action
        - dataClass
        - environment
      failureMode: closed
      auditEvents:
        - policy_decision_recorded
  required:
    - action: send-customer-email
      mode: human
      reason: external side effect
    - action: mutate-crm-record
      mode: policy-and-human
      reason: privileged business data
      policyDecisionPointRef: crm-mutation-policy

observability:
  traces:
    required: true
    format: opentelemetry
  metrics:
    required:
      - request_latency
      - tool_call_count
      - approval_wait_time
      - model_cost
  auditEvents:
    required:
      - deployment_planned
      - policy_decision_recorded
      - approval_requested
      - tool_call_denied
      - approval_granted
      - approval_denied
      - secret_resolved
