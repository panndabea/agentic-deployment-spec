apiVersion: ads.dev/v1
kind: AgenticDeployment
metadata:
  name: missing-policy-decision-point-ref
  owner: platform-team
  labels:
    tier: production

runtime:
  components:
    - name: api
      type: agent-runtime
      image: ghcr.io/example/support-agent:1.0.0
      execution:
        mode: request-response

capabilities:
  required:
    - secret-injection
    - audit-log-export
    - human-approval
    - policy-decision

secrets:
  required:
    - name: model-api-key
      purpose: model-provider-auth
      rotation: required

security:
  defaultSandbox: restricted
  toolPolicy:
    default: deny
  trustBoundaries:
    - name: user-to-agent
      from: user
      to: api
  threatModel:
    assets:
      - customer-support-data
      - model-api-key
    actors:
      - end-user
      - agent-runtime
    threats:
      - id: approval-bypass
        category: policy-bypass
        assets:
          - customer-support-data
        mitigations:
          - policy-gate
    mitigations:
      - id: policy-gate
        fields:
          - approvals.required
    review:
      status: reviewed
      reviewedBy: platform-security

approvals:
  required:
    - action: send-customer-email
      mode: human
      reason: external side effect
    - action: classify-risk
      mode: policy
      reason: policy decision required before privileged action

observability:
  metrics:
    required: []
  auditEvents:
    required:
      - deployment_planned
      - policy_decision_recorded
      - approval_requested
      - approval_granted
      - approval_denied
      - secret_resolved
      - tool_call_denied
