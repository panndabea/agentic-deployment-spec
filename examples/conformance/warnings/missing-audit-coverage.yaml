apiVersion: ads.dev/v1
kind: AgenticDeployment
metadata:
  name: missing-audit-coverage
  owner: platform-team
  labels:
    tier: production

runtime:
  components:
    - name: api
      type: agent-runtime
      image: ghcr.io/example/support-agent:1.0.0
      execution:
        mode: request-response

capabilities:
  required:
    - secret-injection
    - audit-log-export
    - human-approval
    - policy-decision

secrets:
  required:
    - name: model-api-key
      purpose: model-provider-auth
      rotation: required

security:
  defaultSandbox: restricted
  toolPolicy:
    default: deny
    deny:
      - send-customer-email

approvals:
  policyDecisionPoints:
    - name: risk-classification-policy
      engineRef: opa/customer-risk
      appliesTo:
        - classify-risk
      decisionInputs:
        - actor
        - action
        - dataClass
      failureMode: closed
      auditEvents:
        - policy_decision_recorded
  required:
    - action: send-customer-email
      mode: human
      reason: external side effect
    - action: classify-risk
      mode: policy
      reason: policy decision required before privileged action
      policyDecisionPointRef: risk-classification-policy

observability:
  metrics:
    required: []
  auditEvents:
    required:
      - deployment_planned
