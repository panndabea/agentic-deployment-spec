apiVersion: ads.dev/v1
kind: AgenticDeployment
metadata:
  name: duplicate-component
  owner: platform-team

runtime:
  components:
    - name: api
      type: agent-runtime
      image: ghcr.io/example/support-agent:1.0.0
      execution:
        mode: request-response
    - name: api
      type: worker
      image: ghcr.io/example/support-worker:1.0.0
      execution:
        mode: async-worker

capabilities:
  required: []

secrets:
  required: []

security:
  defaultSandbox: restricted
  toolPolicy:
    default: deny

approvals:
  required: []

observability:
  metrics:
    required: []
  auditEvents:
    required: []
