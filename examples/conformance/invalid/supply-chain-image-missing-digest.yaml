apiVersion: ads.dev/v0alpha1
kind: AgenticDeployment
metadata:
  name: missing-image-digest
  owner: platform-team
  labels:
    tier: production

runtime:
  components:
    - name: api
      type: agent-runtime
      image: ghcr.io/example/support-agent:1.0.0
      execution:
        mode: request-response

capabilities:
  required:
    - container-runtime
    - image-signature-verification
    - audit-log-export

secrets:
  required: []

security:
  defaultSandbox: restricted
  toolPolicy:
    default: deny

supplyChain:
  images:
    requireDigest: true
    signature:
      required: true

approvals:
  required: []

observability:
  metrics:
    required: []
  auditEvents:
    required:
      - deployment_planned
      - tool_call_denied
