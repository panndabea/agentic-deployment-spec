apiVersion: ads.dev/v0alpha1
kind: AgenticDeployment
metadata:
  name: missing-policy-decision-point
  owner: platform-team
  labels:
    tier: production

runtime:
  components:
    - name: api
      type: agent-runtime
      image: ghcr.io/example/support-agent:1.0.0
      execution:
        mode: request-response

capabilities:
  required:
    - secret-injection
    - audit-log-export
    - policy-decision

secrets:
  required:
    - name: model-api-key
      purpose: model-provider-auth
      rotation: required

security:
  defaultSandbox: restricted
  toolPolicy:
    default: deny
  trustBoundaries:
    - name: user-to-agent
      from: user
      to: api
  threatModel:
    assets:
      - customer-support-data
      - model-api-key
    actors:
      - end-user
      - agent-runtime
    threats:
      - id: approval-bypass
        category: policy-bypass
        assets:
          - customer-support-data
        mitigations:
          - missing-policy-gate
    mitigations:
      - id: missing-policy-gate
        fields:
          - approvals.required
    review:
      status: reviewed
      reviewedBy: platform-security

approvals:
  policyDecisionPoints:
    - name: declared-risk-policy
      engineRef: opa/customer-risk
      appliesTo:
        - classify-risk
      decisionInputs:
        - actor
        - action
      failureMode: closed
  required:
    - action: classify-risk
      mode: policy
      reason: policy decision required before privileged action
      policyDecisionPointRef: undeclared-risk-policy

observability:
  metrics:
    required: []
  auditEvents:
    required:
      - deployment_planned
      - policy_decision_recorded
      - secret_resolved
      - tool_call_denied
