apiVersion: ads.dev/v1
kind: AgenticDeployment
metadata:
  name: scoped-secret-missing-component
  owner: platform-team

runtime:
  components:
    - name: api
      type: agent-runtime
      image: ghcr.io/example/support-agent:1.0.0
      execution:
        mode: request-response

capabilities:
  required:
    - secret-injection

secrets:
  required:
    - name: model-api-key
      purpose: model-provider-auth
      rotation: required
      for: worker

security:
  defaultSandbox: restricted
  toolPolicy:
    default: deny

approvals:
  required: []

observability:
  metrics:
    required: []
  auditEvents:
    required: []
