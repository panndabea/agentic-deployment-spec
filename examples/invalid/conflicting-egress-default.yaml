apiVersion: ads.dev/v0alpha1
kind: AgenticDeployment
metadata:
  name: conflicting-egress-default
  owner: platform-team

runtime:
  components:
    - name: api
      type: agent-runtime
      image: ghcr.io/example/support-agent:1.0.0
      execution:
        mode: request-response

capabilities:
  required:
    - outbound-egress-policy

secrets:
  required: []

security:
  defaultSandbox: restricted
  outbound:
    default: deny
  toolPolicy:
    default: deny

approvals:
  required: []

observability:
  metrics:
    required: []
  auditEvents:
    required: []

networking:
  egress:
    default: allow
