name: Conformance

"on":
  pull_request:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"

permissions:
  contents: read
  security-events: write

jobs:
  test-examples:
    name: Schema and conformance fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Ruby fixture suite
        run: ruby scripts/test-examples.rb

      - name: Generate SARIF diagnostics
        run: ruby scripts/ads-conformance-check.rb --format sarif examples/*.yaml > ads-conformance.sarif

      - name: Upload SARIF diagnostics
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ads-conformance.sarif
          category: ads-reference-processor

      - name: Run Go tests
        run: go test ./...

      - name: Run independent Go fixture validator
        run: go run ./cmd/ads-fixture-validator
