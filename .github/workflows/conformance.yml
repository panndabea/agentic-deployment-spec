name: Conformance

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-examples:
    name: Schema and conformance fixtures
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run fixture suite
        run: ruby scripts/test-examples.rb
