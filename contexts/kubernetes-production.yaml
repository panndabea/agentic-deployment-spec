targetProfile: kubernetes-production

capabilities:
  supported:
    - container-runtime
    - secret-injection
    - persistent-storage
    - queue
    - vector-store
    - network-policy
    - outbound-egress-policy
    - trace-export
    - metrics-export
    - audit-log-export
    - human-approval
    - policy-decision
    - horizontal-scaling
    - event-driven-scaling
    - rollback
    - dead-letter-queue
    - image-signature-verification

secrets:
  bindings:
    model-api-key:
      source: external-secret-store
      ref: prod/support-agent/model-api-key
    database-url:
      source: external-secret-store
      ref: prod/support-agent/database-url
    crm-api-token:
      source: external-secret-store
      ref: prod/customer-ops/crm-api-token

approvals:
  handlers:
    human:
      ref: ticketing/platform-approval
    policy:
      ref: opa/agentic-deployment

observability:
  traces:
    sinks:
      - opentelemetry-collector
  metrics:
    sinks:
      - prometheus
  auditEvents:
    sinks:
      - security-audit-log

network:
  egress:
    defaultDeny: true
    allow:
      - api.openai.com
      - internal.crm.example
      - crm.internal.example
      - billing.internal.example

security:
  sandbox:
    levels:
      - restricted
      - baseline
  toolPolicy:
    defaults:
      - deny
      - allow
    ruleLists: true

supplyChain:
  signatures:
    available: true
    verifiers:
      - sigstore-cosign
  sbom:
    available: true
    formats:
      - spdx-json
      - cyclonedx-json
  provenance:
    available: true
    predicateTypes:
      - slsa-provenance
