targetProfile: compose-single-host

capabilities:
  supported:
    - container-runtime
    - secret-injection
    - persistent-storage
    - outbound-egress-policy
    - trace-export
    - metrics-export
    - audit-log-export
    - human-approval
    - policy-decision

secrets:
  bindings:
    model-api-key:
      source: platform-secret
      ref: env:MODEL_API_KEY
    database-url:
      source: platform-secret
      ref: env:DATABASE_URL

approvals:
  handlers:
    human:
      ref: local-approval-runbook
    policy:
      ref: local-policy-check
  policyDecisionPoints:
    crm-mutation-policy:
      ref: local/customer-operations-policy
    risk-classification-policy:
      ref: local/customer-risk-policy
    financial-action-policy:
      ref: local/billing-actions-policy
    data-export-policy:
      ref: local/data-export-policy

observability:
  traces:
    sinks:
      - local-otel-collector
  metrics:
    sinks:
      - local-prometheus
  auditEvents:
    sinks:
      - local-audit-log

network:
  egress:
    defaultDeny: true
    allow:
      - api.openai.com
      - internal.crm.example

security:
  sandbox:
    levels:
      - restricted
      - baseline
  toolPolicy:
    defaults:
      - deny
      - allow
    ruleLists: true

supplyChain:
  signatures:
    available: false
  sbom:
    available: false
  provenance:
    available: false
